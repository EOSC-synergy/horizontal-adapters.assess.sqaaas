config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/Ophidia
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/madgeek-arc/horizontal-adapters:
      branch: main
      repo: https://github.com/madgeek-arc/horizontal-adapters
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/madgeek-arc/horizontal-adapters git:
        commands:
        - /usr/bin/env sh .sqa/script.pasty-heliotrope-collie.sh
        container: qc.acc_shaggy-pear-robin
  QC.Doc:
    repos:
      github.com/madgeek-arc/horizontal-adapters find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.skimpy-asparagus-russel.sh
        container: qc.doc_queasy-wisteria-insect
      github.com/madgeek-arc/horizontal-adapters git:
        commands:
        - /usr/bin/env sh .sqa/script.sleepy-teal-vole.sh
        container: qc.doc_shaky-brown-insect
      github.com/madgeek-arc/horizontal-adapters markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.silly-charcoal-kingfisher.sh
        container: qc.doc_sickly-chestnut-snail
  QC.Lic:
    repos:
      github.com/madgeek-arc/horizontal-adapters licensee:
        commands:
        - /usr/bin/env sh .sqa/script.squirrely-apricot-armadillo.sh
        container: qc.lic_squeaky-zucchini-opossum
  QC.Sec:
    repos:
      github.com/madgeek-arc/horizontal-adapters bandit:
        commands:
        - /usr/bin/env sh .sqa/script.queasy-magnolia-mau.sh
        container: qc.sec_whiny-tangerine-budgerigar
  QC.Sty:
    repos:
      github.com/madgeek-arc/horizontal-adapters checkstyle:
        commands:
        - /usr/bin/env sh .sqa/script.skanky-champagne-penguin.sh
        container: qc.sty_leaky-russet-paradise
      github.com/madgeek-arc/horizontal-adapters flake8:
        commands:
        - /usr/bin/env sh .sqa/script.slimy-razzmatazz-lemming.sh
        container: qc.sty_gummy-xanthic-kiwi
  QC.Uni:
    repos:
      github.com/madgeek-arc/horizontal-adapters pytest:
        commands:
        - /usr/bin/env sh .sqa/script.shaggy-lemon-frigatebird.sh
        container: qc.uni_crabby-ultramarine-gharial
  QC.Ver:
    repos:
      github.com/madgeek-arc/horizontal-adapters get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.silly-tan-serval.sh
        container: qc.ver_grumpy-sangria-woodlouse
timeout: 5400
