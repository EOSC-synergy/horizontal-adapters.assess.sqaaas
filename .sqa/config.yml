config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/madgeek-arc/horizontal-adapters:
      branch: main
      repo: https://github.com/madgeek-arc/horizontal-adapters
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/madgeek-arc/horizontal-adapters git:
        commands:
        - /usr/bin/env sh .sqa/script.harlequin_apprehensive_whale.sh
        container: qc.acc_sage_enigmatic_hedgehog
  QC.Doc:
    repos:
      github.com/madgeek-arc/horizontal-adapters find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.pansy_reflective_otter.sh
        container: qc.doc_cherry_skeptical_kangaroo
      github.com/madgeek-arc/horizontal-adapters git:
        commands:
        - /usr/bin/env sh .sqa/script.wine_quirky_cougar.sh
        container: qc.doc_arctic_rational_dragonfly
      github.com/madgeek-arc/horizontal-adapters markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.wine_driven_tapir.sh
        container: qc.doc_storm_understanding_skunk
  QC.Lic:
    repos:
      github.com/madgeek-arc/horizontal-adapters licensee:
        commands:
        - /usr/bin/env sh .sqa/script.flamingo_courageous_moose.sh
        container: qc.lic_mint_persistent_viper
  QC.Sec:
    repos:
      github.com/madgeek-arc/horizontal-adapters bandit:
        commands:
        - /usr/bin/env sh .sqa/script.bone_passionate_manatee.sh
        container: qc.sec_rose_joyful_dugong
  QC.Sty:
    repos:
      github.com/madgeek-arc/horizontal-adapters checkstyle:
        commands:
        - /usr/bin/env sh .sqa/script.lagoon_passionate_porpoise.sh
        container: qc.sty_turquoise_jubilant_caribou
      github.com/madgeek-arc/horizontal-adapters flake8:
        commands:
        - /usr/bin/env sh .sqa/script.dusk_clever_cougar.sh
        container: qc.sty_bronze_mindful_bat
  QC.Uni:
    repos:
      github.com/madgeek-arc/horizontal-adapters pytest:
        commands:
        - /usr/bin/env sh .sqa/script.violet_decisive_reindeer.sh
        container: qc.uni_thistle_optimistic_baboon
  QC.Ver:
    repos:
      github.com/madgeek-arc/horizontal-adapters get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.butter_balanced_weasel.sh
        container: qc.ver_ultramarine_warm_phoenix
timeout: 5400
