config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/Ophidia
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/madgeek-arc/horizontal-adapters:
      branch: main
      repo: https://github.com/madgeek-arc/horizontal-adapters
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/madgeek-arc/horizontal-adapters git:
        commands:
        - /usr/bin/env sh .sqa/script.snazzy-black-numbat.sh
        container: qc.acc_cheeky-grey-saola
  QC.Doc:
    repos:
      github.com/madgeek-arc/horizontal-adapters find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.geeky-wisteria-olm.sh
        container: qc.doc_stuffy-burgundy-markhor
      github.com/madgeek-arc/horizontal-adapters git:
        commands:
        - /usr/bin/env sh .sqa/script.frumpy-beige-javanese.sh
        container: qc.doc_nerdy-taupe-camel
      github.com/madgeek-arc/horizontal-adapters markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.shabby-periwinkle-grouse.sh
        container: qc.doc_boozy-silver-lemming
  QC.Lic:
    repos:
      github.com/madgeek-arc/horizontal-adapters licensee:
        commands:
        - /usr/bin/env sh .sqa/script.slimy-corn-forest.sh
        container: qc.lic_pretty-black-dragonfly
  QC.Sec:
    repos:
      github.com/madgeek-arc/horizontal-adapters bandit:
        commands:
        - /usr/bin/env sh .sqa/script.cloudy-malachite-opossum.sh
        container: qc.sec_surly-champagne-russel
  QC.Sty:
    repos:
      github.com/madgeek-arc/horizontal-adapters checkstyle:
        commands:
        - /usr/bin/env sh .sqa/script.dorky-cinnabar-eagle.sh
        container: qc.sty_pokey-cream-bandicoot
      github.com/madgeek-arc/horizontal-adapters flake8:
        commands:
        - /usr/bin/env sh .sqa/script.thirsty-corn-frigatebird.sh
        container: qc.sty_frumpy-brown-avocet
  QC.Uni:
    repos:
      github.com/madgeek-arc/horizontal-adapters pytest:
        commands:
        - /usr/bin/env sh .sqa/script.shaggy-pumpkin-rhinoceros.sh
        container: qc.uni_stuffy-pink-gharial
  QC.Ver:
    repos:
      github.com/madgeek-arc/horizontal-adapters get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.skimpy-violet-shrimp.sh
        container: qc.ver_gummy-ivory-orangutan
