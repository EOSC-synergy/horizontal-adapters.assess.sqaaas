config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: feature/Ophidia
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/madgeek-arc/horizontal-adapters:
      branch: main
      repo: https://github.com/madgeek-arc/horizontal-adapters
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/madgeek-arc/horizontal-adapters git:
        commands:
        - /usr/bin/env sh .sqa/script.greasy-chocolate-caracal.sh
        container: qc.acc_muzzy-sangria-lion
  QC.Doc:
    repos:
      github.com/madgeek-arc/horizontal-adapters find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.hazy-fuchsia-lynx.sh
        container: qc.doc_scummy-scarlet-loon
      github.com/madgeek-arc/horizontal-adapters git:
        commands:
        - /usr/bin/env sh .sqa/script.shaggy-apricot-ragdoll.sh
        container: qc.doc_snazzy-aqua-giraffe
      github.com/madgeek-arc/horizontal-adapters markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.smelly-cyan-anteater.sh
        container: qc.doc_tasty-mauve-chameleon
  QC.Lic:
    repos:
      github.com/madgeek-arc/horizontal-adapters licensee:
        commands:
        - /usr/bin/env sh .sqa/script.shabby-magenta-spitz.sh
        container: qc.lic_gimpy-heliotrope-booby
  QC.Sec:
    repos:
      github.com/madgeek-arc/horizontal-adapters bandit:
        commands:
        - /usr/bin/env sh .sqa/script.ready-bronze-hyrax.sh
        container: qc.sec_craggy-olivine-mule
  QC.Sty:
    repos:
      github.com/madgeek-arc/horizontal-adapters checkstyle:
        commands:
        - /usr/bin/env sh .sqa/script.homely-amaranth-tetra.sh
        container: qc.sty_pasty-fuchsia-rabbit
      github.com/madgeek-arc/horizontal-adapters flake8:
        commands:
        - /usr/bin/env sh .sqa/script.squeaky-rust-tiger.sh
        container: qc.sty_stinky-rust-bear
  QC.Uni:
    repos:
      github.com/madgeek-arc/horizontal-adapters pytest:
        commands:
        - /usr/bin/env sh .sqa/script.greasy-cinnamon-lobster.sh
        container: qc.uni_stuffy-lime-budgerigar
  QC.Ver:
    repos:
      github.com/madgeek-arc/horizontal-adapters get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.scanty-chocolate-buzzard.sh
        container: qc.ver_leaky-white-seahorse
timeout: 5400
